<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BMI App</title>

    <script src.jsdelivr.net/npm/@supabase/supabase-js@2script>
</head>

<body>

    <h1>Kalkulator Berat Badan Ideal</h1>

    <p>Tinggi Badan (cm)</p>
    <input type="number" id="tinggi">

    <p>Berat Badan (kg)</p>
    <input type="number" id="berat">

    <br><br>

    <button onclick="hitung()">
        Hitung BMI
    </button>

    <h2 id="hasil"></h2>

    <script>

    const SUPABASE_URL = "https://uctizwdxntiqkyqwlvae.supabase.co";
    const SUPABASE_KEY = "sb_publishable_FsyLzPf8bOnOWBGhp9lUZQ_6JDvRPkr";

    const client = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function hitung() {

        let tinggi = document.getElementById("tinggi").value;
        let berat = document.getElementById("berat").value;

        let bmi =
            berat / ((tinggi / 100) * (tinggi / 100));

        document.getElementById("hasil").innerHTML =
            "BMI Anda : " + bmi.toFixed(2);

        const { error } = await client
            .from("bmi_records")
            .insert([
                {
                    tinggi: parseInt(tinggi),
                    berat: parseInt(berat),
                    bmi: parseFloat(bmi.toFixed(2))
                }
            ]);

        if (error) {
            console.error(error);
        }
    }

    </script>

</body>
</html>
